services:
  peterbot:
    build:
      context: .
      target: bundled
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./docker/config.bundled.json:/app/config.json:ro
      - ./models:/models:ro
      - ./peterbot-data:/app/peterbot-data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import socket; socket.create_connection(("127.0.0.1", 8080), 2).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
